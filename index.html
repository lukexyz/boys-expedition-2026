<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolomites 2026 — The Boys' Expedition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#0d171d; --panel:#16262e; --panel2:#1d3039;
  --line:rgba(244,239,231,.14);
  --orange:#ED6A2C; --orange2:#f79a6b; --amber:#F2C14E;
  --cream:#F4EFE7; --muted:#93a8b2; --blue:#4FA3D1;
  --topbar:64px; --plan:322px; --cards:294px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ================= MAP ================= */
#map{position:fixed;inset:var(--topbar) 0 0 0;background:#0b1116;z-index:1}
.leaflet-container{font-family:inherit;background:#0b1116}

/* ================= TOP BAR ================= */
#top{position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:1000;display:flex;align-items:center;
  gap:16px;padding:0 16px;background:rgba(13,23,29,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 4px 26px rgba(0,0,0,.5)}
#brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;white-space:nowrap}
#brand .t{font-size:16px;font-weight:800;letter-spacing:-.02em}
#brand .t em{font-style:normal;color:var(--orange)}
#brand .d{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

#nav{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.arrow{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;
  justify-content:center;font-size:16px;color:var(--muted);flex:0 0 auto;transition:.15s}
.arrow:hover{background:rgba(255,255,255,.14);color:var(--cream)}
.arrow:disabled{opacity:.25;cursor:default;background:rgba(255,255,255,.04)}
#days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
#days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:6px 13px 7px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid transparent;text-align:center;line-height:1.15;transition:.15s;min-width:64px}
.day:hover{background:rgba(255,255,255,.11)}
.day .dw{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.day .dd{font-size:13px;font-weight:800;margin-top:1px}
.day.on{background:var(--orange);border-color:var(--orange);box-shadow:0 3px 16px rgba(237,106,44,.4)}
.day.on .dw{color:rgba(255,255,255,.82)}
.day.on .dd{color:#fff}
.day.all .dd{font-size:11.5px;letter-spacing:.05em;padding-top:3px}

#topright{flex:0 0 auto;display:flex;gap:7px;align-items:center}
.tbtn{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.06);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);transition:.15s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.13);color:var(--cream)}
.tbtn.on{background:rgba(237,106,44,.22);color:var(--orange2)}
.viewswitch{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04)}
.viewswitch a,.viewswitch span{padding:5px 7px;border-radius:6px;font-size:8px;font-weight:900;letter-spacing:.08em;
  line-height:1;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-decoration:none}
.viewswitch a:hover{color:var(--cream);background:rgba(255,255,255,.08)}
.viewswitch span{background:var(--orange);color:#fff}

/* ================= PLAN PANEL ================= */
#plan{position:fixed;left:14px;top:calc(var(--topbar) + 14px);width:var(--plan);z-index:900;
  background:rgba(16,38,46,.93);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 46px rgba(0,0,0,.6);overflow:hidden;max-height:min(54vh, calc(100vh - var(--topbar) - 292px));
  display:flex;flex-direction:column;transition:transform .28s ease}
#plan.min{transform:translateX(calc(-100% - 20px))}
#planhead{padding:12px 14px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  position:relative;overflow:hidden;flex:0 0 auto}
#planhead svg{position:absolute;inset:0;width:100%;height:100%;opacity:.3}
#planhead h2{position:relative;margin:0;font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
#planhead .sub{position:relative;margin-left:auto;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.07em}
#planbody{overflow-y:auto;padding:7px 9px 11px;scrollbar-width:thin;scrollbar-color:#33505d transparent}
#planbody::-webkit-scrollbar{width:7px}
#planbody::-webkit-scrollbar-thumb{background:#33505d;border-radius:8px}

.prow{display:flex;gap:10px;padding:9px 9px;border-radius:10px;cursor:pointer;transition:.15s;position:relative}
.prow:hover{background:rgba(255,255,255,.07)}
.prow.on{background:rgba(237,106,44,.16);box-shadow:inset 0 0 0 1px rgba(237,106,44,.45)}
.prow .pd{flex:0 0 42px;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--orange);
  text-transform:uppercase;padding-top:2px;line-height:1.3}
.prow.on .pd{color:var(--amber)}
.prow .pt{font-size:12.5px;font-weight:700;line-height:1.35}
.prow .pn{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
.prow .bed{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
  background:rgba(237,106,44,.2);color:var(--orange2);padding:2px 6px;border-radius:4px}
#planfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 13px 11px;font-size:10.5px;
  color:#6f8996;line-height:1.55}
#planfoot b{color:#a9bdc6}

/* ================= DAY BRIEF ================= */
#brief{position:fixed;left:14px;bottom:14px;width:var(--plan);z-index:900;
  background:rgba(16,38,46,.93);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 46px rgba(0,0,0,.6);padding:13px 15px 14px;transition:opacity .2s}
#brief .kick{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--orange)}
#brief h3{margin:4px 0 6px;font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
#brief p{margin:0;font-size:12px;color:#bccbd2;line-height:1.55}
#brief .stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#brief .s{background:rgba(255,255,255,.07);border-radius:7px;padding:5px 9px;text-align:center;flex:1 1 auto}
#brief .s .v{font-size:12.5px;font-weight:800;line-height:1.1}
#brief .s .k{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7f97a2;margin-top:2px}
#brief .warn{margin-top:9px;font-size:11px;background:rgba(237,106,44,.15);border-left:2px solid var(--orange);
  padding:7px 10px;border-radius:0 7px 7px 0;color:#f3c6ad;line-height:1.5}
#brief .wxhead{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:8px;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
#brief .wxhead b{color:var(--blue)}#brief .wxhead a{margin-left:auto;color:#6f8996;text-decoration:none}
#brief .wxcards{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:5px}#brief .wxcards::-webkit-scrollbar{display:none}
#brief .wxcard{flex:1 0 82px;min-width:82px;border-radius:8px;background:rgba(255,255,255,.06);padding:6px 7px}
#brief .wxday{font-size:7.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
#brief .wxmain{display:flex;align-items:center;gap:5px;margin-top:3px}.wxicon{font-size:16px}.wxtemp{font-size:11px;font-weight:900}
#brief .wxrain{font-size:8.5px;color:#b9d9ea;font-weight:800;margin-top:3px;white-space:nowrap}
#brief .wxstate{margin-top:9px;font-size:9px;color:var(--muted)}

/* ================= PHOTO CARDS ================= */
#cards{position:fixed;right:14px;top:calc(var(--topbar) + 14px);bottom:14px;width:var(--cards);z-index:900;
  display:flex;flex-direction:column;justify-content:center;gap:12px;pointer-events:none}
.card{pointer-events:auto;background:rgba(16,38,46,.95);border:1px solid rgba(244,239,231,.2);border-radius:12px;
  overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.65);cursor:pointer;position:relative;
  transition:transform .18s ease, box-shadow .18s ease;animation:cardin .34s ease both}
.card:hover{transform:translateX(-5px) scale(1.02);box-shadow:0 18px 52px rgba(0,0,0,.8);border-color:var(--amber)}
@keyframes cardin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.card .ph{height:132px;background:linear-gradient(135deg,#2b4552,#16262e);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .badge{position:absolute;left:-9px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--amber);
  color:#1a1206;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(13,23,29,.9);box-shadow:0 3px 10px rgba(0,0,0,.6);z-index:3}
.card .name{position:absolute;left:8px;bottom:8px;background:var(--amber);color:#1a1206;font-size:11px;
  font-weight:800;letter-spacing:.02em;padding:3px 8px;border-radius:5px;z-index:2;max-width:calc(100% - 16px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .opt{position:absolute;right:8px;top:8px;background:rgba(13,23,29,.85);color:var(--orange2);font-size:9px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;z-index:2;
  border:1px solid rgba(237,106,44,.5)}
.card .meta{padding:8px 11px 10px}
.card .meta .l{font-size:11.5px;color:#bccbd2;line-height:1.45}
.card .meta .chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.card .meta .c{font-size:9.5px;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.09);
  color:#cfdde3;padding:2.5px 6px;border-radius:4px}
.card .meta .c.o{background:rgba(237,106,44,.2);color:var(--orange2)}

#leads{position:fixed;inset:0;z-index:880;pointer-events:none}

/* ================= MARKERS ================= */
.pin{position:relative;width:0;height:0}
.pin .dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:900;color:#fff;border:2.5px solid #fff;box-shadow:0 3px 13px rgba(0,0,0,.7);
  transition:transform .18s ease;cursor:pointer}
.pin:hover .dot{transform:translate(-50%,-50%) scale(1.16)}
.pin.num .dot{width:30px;height:30px;font-size:14px;background:var(--amber);color:#1a1206;border-color:#fff}
.pin.hike .dot{width:30px;height:30px;font-size:14px;background:var(--orange)}
.pin.base .dot{width:33px;height:33px;font-size:15px;background:#12222a;border-color:var(--orange);color:var(--orange)}
.pin.air  .dot{width:26px;height:26px;font-size:12px;background:var(--blue)}
.pin.poi  .dot{width:13px;height:13px;background:var(--cream);border-width:2px;border-color:#3a5866}
.pin .lbl{position:absolute;left:50%;top:calc(50% + 19px);transform:translateX(-50%);background:rgba(11,20,26,.88);
  color:var(--cream);font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:5px;white-space:nowrap;
  border:1px solid rgba(244,239,231,.17);pointer-events:none;text-shadow:0 1px 2px #000}
.pin.up .lbl{top:auto;bottom:calc(50% + 19px)}
.pin.base .lbl{border-color:rgba(237,106,44,.55);color:#ffd9c5}
.pin.poi .lbl{top:calc(50% + 9px);font-size:9.5px;font-weight:600;color:#c6d5dc;background:rgba(11,20,26,.72);padding:1.5px 5px}
.pin .nb{position:absolute;left:calc(50% + 13px);top:calc(50% - 21px);transform:translateX(-50%);background:var(--orange);
  color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;border:1.5px solid #12222a;
  white-space:nowrap;pointer-events:none}
.zfar .pin.poi{display:none}
.zfar .pin.hike .lbl,.zfar .pin.num .lbl{display:none}

/* you are here */
.here{position:relative;width:0;height:0}
.here .ring{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
  background:transparent;border:2.5px solid var(--amber);box-shadow:0 0 0 0 rgba(242,193,78,.75);animation:pulse 2.1s infinite}
.here .core{position:absolute;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;
  background:var(--amber);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.7)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,193,78,.6)}70%{box-shadow:0 0 0 24px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
.here .tag{position:absolute;left:50%;bottom:calc(50% + 27px);transform:translateX(-50%);background:var(--amber);
  color:#1a1206;font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;
  border-radius:5px;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.6)}

/* ================= POPUPS ================= */
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--cream);border-radius:14px;padding:0;
  border:1px solid rgba(244,239,231,.16);overflow:hidden;box-shadow:0 20px 56px rgba(0,0,0,.75)}
.leaflet-popup-content{margin:0;width:308px !important;line-height:1.5}
.leaflet-popup-tip{background:var(--panel);border:1px solid rgba(244,239,231,.16)}
.leaflet-popup-close-button{color:#fff !important;font-size:22px !important;width:30px !important;height:30px !important;
  padding:2px 0 0 0 !important;text-shadow:0 1px 3px #000;z-index:5}
.pop .img{height:136px;background:linear-gradient(135deg,#2b4552,#16262e);position:relative;overflow:hidden}
.pop .img img{width:100%;height:100%;object-fit:cover;display:block}
.pop .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,23,29,0) 42%,rgba(13,23,29,.93) 100%)}
.pop .img .cap{position:absolute;left:14px;right:14px;bottom:9px;z-index:2}
.pop .img .kick{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);text-shadow:0 1px 4px #000}
.pop .img h3{margin:2px 0 0;font-size:16.5px;font-weight:800;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.85)}
.pop .body{padding:12px 14px 14px}
.pop .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pop .st{background:rgba(255,255,255,.07);border-radius:7px;padding:6px 3px;text-align:center}
.pop .st .v{font-size:12.5px;font-weight:800;line-height:1.1}
.pop .st .k{font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#7f97a2;margin-top:3px}
.pop p{margin:0 0 9px;font-size:12.5px;color:#c8d6dc}
.pop .row{display:flex;gap:8px;font-size:11.5px;color:#b3c4cc;padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}
.pop .row b{color:var(--cream);flex:0 0 70px;font-weight:700}
.pop .flag{font-size:11.5px;background:rgba(237,106,44,.15);border-left:2px solid var(--orange);padding:7px 10px;
  border-radius:0 7px 7px 0;color:#f3c6ad;margin-top:9px;line-height:1.5}
.pop a.btn{display:inline-block;margin-top:11px;background:var(--orange);color:#fff;text-decoration:none;font-size:10.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:7px}
.pop a.btn.ghost{background:rgba(255,255,255,.09);color:#cfdde3;margin-left:6px}
.pop .cred{margin-top:9px;font-size:9.5px;color:#5f7885}

/* ================= LEGEND ================= */
#legend{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:890;display:flex;gap:14px;
  align-items:center;background:rgba(13,23,29,.9);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:11px;padding:9px 15px;box-shadow:0 8px 30px rgba(0,0,0,.55);font-size:11px;color:#c0ced5}
#legend .lg{display:flex;align-items:center;gap:7px;white-space:nowrap}
#legend .sw{width:22px;border-top:3px solid;border-radius:2px}
#legend .swd{width:12px;height:12px;border-radius:50%;border:2px solid #fff}

.leaflet-control-attribution{background:rgba(13,23,29,.85) !important;color:#6f8996 !important;font-size:9px !important}
.leaflet-control-attribution a{color:#8ea3ad !important}
.leaflet-bar a{background:#1d3039 !important;color:var(--cream) !important;border-color:var(--line) !important}
.leaflet-bar a:hover{background:#2b4552 !important}
.leaflet-control-layers{background:rgba(13,23,29,.93) !important;color:var(--cream) !important;
  border:1px solid var(--line) !important;border-radius:10px !important;backdrop-filter:blur(10px)}
.leaflet-control-layers-expanded{padding:10px 12px !important;font-size:12px}

/* ================= RESPONSIVE ================= */
@media (max-width:1180px){
  :root{--plan:280px;--cards:250px}
  .card .ph{height:112px}
  .card .meta .l{display:none}
}
@media (max-width:760px){
  #brand{display:none}
  #tPlan,#tOpt{display:none}
  .tbtn{padding:6px 9px;font-size:9.5px;letter-spacing:.04em}
  #topright{gap:5px}
  #nav{justify-content:flex-start;gap:4px}
  .day{min-width:50px;padding:5px 9px 6px}
  .day .dd{font-size:12px}
  .arrow{width:28px;height:28px}
}
@media (max-width:960px){
  :root{--topbar:58px}
  #brand .d{display:none}
  #plan{max-height:44vh;width:min(320px,72vw)}
  #brief{display:none}
  #legend{display:none}
  #cards{right:0;left:0;top:auto;bottom:10px;width:auto;flex-direction:row;justify-content:flex-start;
    overflow-x:auto;padding:0 12px 4px;gap:10px}
  #cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 190px}
  .card .ph{height:100px}
  .card:hover{transform:none}
  #leads{display:none}
  .leaflet-popup-content{width:248px !important}
}
</style>
</head>
<body>

<div id="top">
  <div id="brand"><span class="t">Dolomites <em>2026</em></span><span class="d">The Boys' Expedition</span></div>
  <div id="nav">
    <button class="arrow" id="prev" title="Previous day (←)">‹</button>
    <div id="days"></div>
    <button class="arrow" id="next" title="Next day (→)">›</button>
  </div>
  <div id="topright">
    <nav class="viewswitch" aria-label="Choose page layout">
      <span aria-current="page">Desktop</span><a href="bento.html">Mobile</a>
    </nav>
    <button class="tbtn" id="tPlan">Plan</button>
    <button class="tbtn on" id="tOpt">Optional</button>
  </div>
</div>

<div id="map"></div>
<svg id="leads"></svg>

<aside id="plan">
  <div id="planhead">
    <svg viewBox="0 0 320 44" preserveAspectRatio="none"><g fill="none" stroke="#ED6A2C" stroke-width="1">
      <path d="M-10 40 C 60 26, 110 48, 175 34 S 280 16, 340 30"/>
      <path d="M-10 30 C 60 16, 112 38, 177 24 S 280 4, 340 20"/>
      <path d="M-10 20 C 62 6, 114 28, 179 14 S 280 -6, 340 10"/>
      <path d="M-10 10 C 64 -4, 116 18, 181 4 S 280 -16, 340 0"/>
    </g></svg>
    <h2>The Plan</h2><span class="sub">18–23 Aug</span>
  </div>
  <div id="planbody"></div>
  <div id="planfoot"><b>Routes are indicative</b> — drawn through the real waypoints, not surveyed GPX. Download proper tracks from the linked guides and carry them offline.</div>
</aside>

<div id="brief"></div>
<div id="cards"></div>

<div id="legend">
  <div class="lg"><span class="sw" style="border-color:#ED6A2C"></span>Planned hike</div>
  <div class="lg"><span class="sw" style="border-color:#f79a6b;border-top-style:dashed"></span>Optional / alternate</div>
  <div class="lg"><span class="sw" style="border-color:#4FA3D1;border-top-style:dotted"></span>Drive</div>
  <div class="lg"><span class="swd" style="background:#F2C14E"></span>Tonight's bed</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="weather.js"></script>
<script>
/* ==========================================================================
   DOLOMITES 2026 — THE BOYS' EXPEDITION
   Day-by-day map. Routes are indicative lines through real waypoints.
   ========================================================================== */

const C = {

const labels = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {maxZoom:19,subdomains:'abcd',opacity:.85,attribution:'&copy; CARTO'});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {maxZoom:17,subdomains:'abc',attribution:'&copy; OpenTopoMap (CC-BY-SA) · &copy; OpenStreetMap'});
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {maxZoom:19,subdomains:'abcd',attribution:'&copy; CARTO · &copy; OpenStreetMap'});
const satG = L.layerGroup([sat,labels]).addTo(map);
L.control.layers({"Satellite":satG,"Topo / trails":topo,"Dark":dark},null,{position:'topright'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);
map.setView([46.52,11.98],10);

const layer = L.layerGroup().addTo(map);      // routes + pins for the active day
let showOpt = true, activeCards = [], cur = 0;
let regionalWeather=null,weatherFailed=false;
const briefWeatherDates=[
  ['2026-08-18','2026-08-19','2026-08-20','2026-08-21','2026-08-22','2026-08-23'],
  ['2026-08-18'],['2026-08-19'],['2026-08-20'],['2026-08-21'],['2026-08-22'],['2026-08-23']
];

const STYLE = {
  hike : {color:'#ED6A2C', weight:4,   opacity:.96},
  opt  : {color:'#f79a6b', weight:3,   opacity:.9, dashArray:'2,9'},
  drive: {color:'#4FA3D1', weight:2.4, opacity:.7, dashArray:'1,7'},
  lift : {color:'#8FD0A8', weight:2.4, opacity:.85, dashArray:'9,6'}
};

/* ---------------- POPUP ---------------- */
function popHTML(p){
  const img = p.photo
    ? `<div class="img"><img src="${p.photo}" alt="" loading="lazy" onerror="this.style.display='none'">
         <div class="cap"><div class="kick">${p.kick||''}</div><h3>${p.n}</h3></div></div>`
    : `<div class="img"><div class="cap"><div class="kick">${p.kick||''}</div><h3>${p.n}</h3></div></div>`;
  const st = p.stats ? `<div class="stats">${p.stats.map(s=>`<div class="st"><div class="v">${s[0]}</div><div class="k">${s[1]}</div></div>`).join('')}</div>`:'';
  const rows = p.rows ? p.rows.map(r=>`<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('') : '';
  const flag = p.flag ? `<div class="flag">${p.flag}</div>`:'';
  const link = p.link ? `<a class="btn" href="${p.link}" target="_blank" rel="noopener">Full guide ↗</a>`:'';
  const gm = `https://www.google.com/maps/search/?api=1&query=${p.at[0]},${p.at[1]}`;
  const cred = p.cred ? `<div class="cred">Photo: ${p.cred} — Wikimedia Commons</div>`:'';
  return `<div class="pop">${img}<div class="body">${st}<p>${p.blurb||''}</p>${rows}${flag}
    ${link}<a class="btn ghost" href="${gm}" target="_blank" rel="noopener">Maps ↗</a>${cred}</div></div>`;
}

/* ---------------- RENDER A DAY ---------------- */
function pinIcon(cls,glyph,label,nb,up){
  return L.divIcon({className:'',iconSize:[0,0],html:
    `<div class="pin ${cls}${up?' up':''}"><div class="dot">${glyph||''}</div>
     ${nb?`<div class="nb">${nb}</div>`:''}${label?`<div class="lbl">${label}</div>`:''}</div>`});
}

function render(i){
  cur = i;
  const d = DAYS[i];
  layer.clearLayers();
  const pts = [];

  /* routes */
  (d.all ? DAYS.filter(x=>!x.all).flatMap(x=>x.routes||[]) : (d.routes||[])).forEach(r=>{
    if((r.t==='opt'||r.opt) && !showOpt) return;
    const st = STYLE[r.t]||STYLE.hike;
    if(r.t==='hike') L.polyline(r.pts,{color:'#0b1116',weight:9,opacity:.45}).addTo(layer);
    L.polyline(r.pts,st).bindTooltip(r.l,{sticky:true}).addTo(layer);
    r.pts.forEach(p=>pts.push(p));
  });

  /* small waypoints */
  if(!d.all) (d.pois||[]).forEach(([lbl,at])=>{
    L.marker(at,{icon:pinIcon('poi','',lbl),zIndexOffset:80}).addTo(layer);
  });

  /* overview: every hike + bed */
  if(d.all){
    ['nuvolau','lagazuoi','pizboe','treCime','vajolet','seceda'].forEach(k=>{
      const p = PL[k]; if(p.opt && !showOpt) return;
      L.marker(p.at,{icon:pinIcon('hike',p.g,p.n),zIndexOffset:400})
        .bindTooltip(p.n,{direction:'top',offset:[0,-18]})
        .bindPopup(popHTML(p),{maxWidth:330,autoPanPaddingTopLeft:[Math.round(vw()*.28),90],autoPanPaddingBottomRight:[Math.round(vw()*.24),50]}).addTo(layer);
      pts.push(p.at);
    });
    ['sanvito','realberto','fermeda'].forEach(k=>{
      const p = PL[k];
      L.marker(p.at,{icon:pinIcon('base','▲',p.n,p.nb,true),zIndexOffset:900})
        .bindPopup(popHTML(p),{maxWidth:330,autoPanPaddingTopLeft:[Math.round(vw()*.28),90],autoPanPaddingBottomRight:[Math.round(vw()*.24),50]}).addTo(layer);
      pts.push(p.at);
    });
    L.marker(PL.vce.at,{icon:pinIcon('air','✈','Venice · in & out'),zIndexOffset:300})
      .bindPopup(popHTML(PL.vce),{maxWidth:330}).addTo(layer);
    pts.push(PL.vce.at);
  }

  /* numbered card pins */
  activeCards = [];
  (d.cards||[]).forEach((k,idx)=>{
    const p = PL[k];
    if(p.opt && !showOpt) return;
    activeCards.push({i:activeCards.length+1, key:k, at:p.at, p});
  });
  if(!d.all) activeCards.forEach(c=>{
    const m = L.marker(c.at,{icon:pinIcon('num',c.i,c.p.n,null,true),zIndexOffset:700})
      .bindPopup(popHTML(c.p),{maxWidth:330,autoPanPaddingTopLeft:[Math.round(vw()*.30),90],autoPanPaddingBottomRight:[Math.round(vw()*.26),50]});
    m.addTo(layer); c.m = m; pts.push(c.at);
  });

  /* tonight's bed */
  if(d.here && !d.all){
    const p = PL[d.here];
    L.marker(p.at,{icon:L.divIcon({className:'',iconSize:[0,0],
      html:`<div class="here"><div class="tag">${d.bed?'Tonight · '+d.bed:'You are here'}</div><div class="ring"></div><div class="core"></div></div>`}),
      zIndexOffset:600,interactive:false}).addTo(layer);
    pts.push(p.at);
  }

  fit(d.focus && d.focus.length ? d.focus : pts);
  paintCards(d);
  paintBrief(d);
  paintNav();
}

function vw(){return window.innerWidth}
function fit(pts){
  if(!pts.length) return;
  const mob = vw()<=960;
  const L1 = mob?30:(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--plan'))+40);
  const R1 = mob?30:(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cards'))+40);
  map.invalidateSize({animate:false});
  map.flyToBounds(L.latLngBounds(pts),{paddingTopLeft:[L1,mob?30:40],
    paddingBottomRight:[R1,mob?150:60],duration:.85,maxZoom:14.5});
}

/* ---------------- CARDS ---------------- */
function paintCards(d){
  const box = document.getElementById('cards');
  box.innerHTML='';
  activeCards.forEach(c=>{
    const p = c.p;
    const el = document.createElement('div');
    el.className='card'; el.id='card-'+c.i;
    el.style.animationDelay = (c.i-1)*70+'ms';
    const chips = (p.stats||[]).slice(0,3).filter(s=>s[0]!=='—')
      .map((s,i)=>`<span class="c ${i===0?'o':''}">${s[0]} ${s[1].toLowerCase()}</span>`).join('');
    el.innerHTML = `
      <div class="ph">
        <div class="badge">${c.i}</div>
        ${p.opt?'<div class="opt">Optional</div>':''}
        <img src="${p.photo||''}" alt="" loading="lazy" onerror="this.style.display='none'">
        <div class="name">${p.n}</div>
      </div>
      <div class="meta"><div class="l">${p.kick||''}</div><div class="chips">${chips}</div></div>`;
    el.onclick=()=>{
      if(c.m){ map.flyTo(c.at, Math.max(map.getZoom(),13), {duration:.7});
        map.once('moveend',()=>setTimeout(()=>c.m.openPopup(),40)); }
      else { map.flyTo(c.at,12.5,{duration:.7}); }
    };
    box.appendChild(el);
  });
  requestAnimationFrame(drawLeads);
}

/* leader lines from card to map point */
function drawLeads(){
  const svg = document.getElementById('leads');
  svg.setAttribute('viewBox',`0 0 ${vw()} ${window.innerHeight}`);
  svg.setAttribute('width',vw()); svg.setAttribute('height',window.innerHeight);
  svg.innerHTML='';
  if(vw()<=960) return;
  const mr = document.getElementById('map').getBoundingClientRect();
  activeCards.forEach(c=>{
    const el = document.getElementById('card-'+c.i); if(!el) return;
    const r = el.getBoundingClientRect();
    const cp = map.latLngToContainerPoint(c.at);
    const tx = cp.x + mr.left, ty = cp.y + mr.top;
    if(tx < 0 || ty < mr.top || tx > vw() || ty > window.innerHeight) return;
    const ax = r.left, ay = r.top + r.height/2;
    if(tx > ax - 12) return;                       // target is under the card column
    const mx = (ax + tx)/2;
    const path = `M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${ty}, ${tx} ${ty}`;
    svg.insertAdjacentHTML('beforeend',
      `<path d="${path}" fill="none" stroke="#F2C14E" stroke-width="1.6" stroke-dasharray="5,4" opacity=".75"/>
       <circle cx="${tx}" cy="${ty}" r="4.5" fill="none" stroke="#F2C14E" stroke-width="1.8" opacity=".95"/>
       <circle cx="${ax}" cy="${ay}" r="2.6" fill="#F2C14E" opacity=".95"/>`);
  });
}
map.on('move zoom viewreset',drawLeads);
window.addEventListener('resize',()=>{drawLeads();clearTimeout(window.__r);window.__r=setTimeout(()=>render(cur),260)});

/* ---------------- BRIEF + NAV + PLAN ---------------- */
function paintBrief(d){
  const b = document.getElementById('brief');
  b.innerHTML = `<div class="kick">${d.kick}</div><h3>${d.title}</h3><p>${d.text}</p>
    <div class="stats">${(d.stats||[]).map(s=>`<div class="s"><div class="v">${s[0]}</div><div class="k">${s[1]}</div></div>`).join('')}</div>
    ${d.warn?`<div class="warn">${d.warn}</div>`:''}${briefWeatherHTML(cur)}`;
}

function briefWeatherHTML(dayIndex){
  if(weatherFailed)return '<div class="wxstate">Regional forecast unavailable.</div>';
  if(!regionalWeather)return '<div class="wxstate">Loading Cortina forecast…</div>';
  const fmt=date=>new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',timeZone:'Europe/Rome'}).format(new Date(date+'T12:00:00+02:00'));
  const wanted=briefWeatherDates[dayIndex].map(date=>regionalWeather.find(day=>day.date===date)).filter(Boolean);
  if(!wanted.length)return '<div class="wxstate">Trip dates outside the live forecast window.</div>';
  return `<div class="wxhead"><b>Live Cortina forecast</b><span>valley baseline</span><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo ↗</a></div>
    <div class="wxcards">${wanted.map(w=>`<div class="wxcard" title="${w.label}"><div class="wxday">${fmt(w.date)}</div>
      <div class="wxmain"><span class="wxicon">${w.icon}</span><span class="wxtemp">${w.high}° / ${w.low}°</span></div>
      <div class="wxrain">💧 ${w.rain.toFixed(1)} mm rain · ${w.chance}%</div></div>`).join('')}</div>`;
}

function paintNav(){
  document.querySelectorAll('#days .day').forEach((el,i)=>el.classList.toggle('on',i===cur));
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===DAYS.length-1;
  document.querySelectorAll('#planbody .prow').forEach((el,i)=>el.classList.toggle('on',i+1===cur));
  const on = document.querySelector('#days .day.on');
  if(on) on.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

const daysEl = document.getElementById('days');
DAYS.forEach((d,i)=>{
  const b = document.createElement('button');
  b.className = 'day' + (d.all?' all':'');
  b.innerHTML = `<div class="dw">${d.dow}</div><div class="dd">${d.dd}</div>`;
  b.onclick = ()=>render(i);
  daysEl.appendChild(b);
});

const planBody = document.getElementById('planbody');
DAYS.filter(d=>!d.all).forEach((d,i)=>{
  const row = document.createElement('div');
  row.className='prow';
  row.innerHTML = `<div class="pd">${d.dow}<br>${d.dd}</div>
    <div><div class="pt">${d.title}</div><div class="pn">${d.kick}</div>
    ${d.bed?`<span class="bed">🛏 ${d.bed}</span>`:''}</div>`;
  row.onclick=()=>render(i+1);
  planBody.appendChild(row);
});

document.getElementById('prev').onclick=()=>render(Math.max(0,cur-1));
document.getElementById('next').onclick=()=>render(Math.min(DAYS.length-1,cur+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') render(Math.min(DAYS.length-1,cur+1));
  if(e.key==='ArrowLeft')  render(Math.max(0,cur-1));
});
document.getElementById('tPlan').onclick=e=>{
  const p=document.getElementById('plan'); p.classList.toggle('min');
  e.currentTarget.classList.toggle('on',!p.classList.contains('min'));
  setTimeout(drawLeads,320);
};
document.getElementById('tOpt').onclick=e=>{
  showOpt=!showOpt; e.currentTarget.classList.toggle('on',showOpt); render(cur);
};

/* zoom declutter */
map.on('zoomend',()=>map.getContainer().classList.toggle('zfar',map.getZoom()<11.6));

if(vw()<=960){document.getElementById('plan').classList.add('min');document.getElementById('tPlan').classList.remove('on');}
render(0);
setTimeout(()=>render(0),200);
TripWeather.load().then(days=>{regionalWeather=days;paintBrief(DAYS[cur])}).catch(()=>{weatherFailed=true;paintBrief(DAYS[cur])});
</script>
</body>
</html>
