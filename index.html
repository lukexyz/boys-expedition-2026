<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dolomites 2026 — The Boys' Expedition | Master Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#0f1a20;
    --panel:#1d2f38;
    --panel2:#26404b;
    --line:rgba(244,239,231,.14);
    --orange:#ED6A2C;
    --orange-soft:#f79a6b;
    --cream:#F4EFE7;
    --muted:#9db0ba;
    --blue:#4FA3D1;
    --green:#63B98A;
    --sidebar:420px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}

  #app{display:flex;height:100%;width:100%}

  /* ---------- SIDEBAR ---------- */
  #side{width:var(--sidebar);flex:0 0 var(--sidebar);height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#16262e 0%,#0f1a20 100%);border-right:1px solid var(--line);z-index:1200;
    box-shadow:6px 0 30px rgba(0,0,0,.5)}
  .brand{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;flex:0 0 auto}
  .brand svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.25;pointer-events:none}
  .brand h1{position:relative;margin:0;font-size:21px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
  .brand h1 em{font-style:normal;color:var(--orange)}
  .brand .dates{position:relative;margin-top:7px;font-size:12px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
  .brand .sub{position:relative;margin-top:9px;font-size:12.5px;color:#c3d1d8;line-height:1.5}

  .tabs{display:flex;gap:6px;padding:12px 14px 4px;flex:0 0 auto}
  .tab{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;border:1px solid transparent;
    transition:.15s;user-select:none}
  .tab:hover{background:rgba(255,255,255,.1);color:var(--cream)}
  .tab.on{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 3px 14px rgba(237,106,44,.35)}

  #list{flex:1 1 auto;overflow-y:auto;padding:8px 14px 30px;scrollbar-width:thin;scrollbar-color:#3a5561 transparent}
  #list::-webkit-scrollbar{width:8px}
  #list::-webkit-scrollbar-thumb{background:#33505d;border-radius:8px}

  .daycard{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;margin:9px 0;
    padding:12px 13px 12px 14px;cursor:pointer;position:relative;transition:.16s;overflow:hidden}
  .daycard:hover{background:rgba(255,255,255,.09);transform:translateX(2px)}
  .daycard.active{background:rgba(237,106,44,.13);border-color:rgba(237,106,44,.6)}
  .daycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,#3d5b68)}
  .dhead{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
  .dnum{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--orange);text-transform:uppercase;white-space:nowrap}
  .ddate{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.05em;margin-left:auto;white-space:nowrap}
  .dtitle{font-size:14.5px;font-weight:700;line-height:1.3;margin:0 0 5px}
  .dmeta{font-size:11.5px;color:#a9bdc6;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:5px;
    background:rgba(255,255,255,.09);color:#cfdde3;white-space:nowrap}
  .chip.o{background:rgba(237,106,44,.2);color:var(--orange-soft)}
  .chip.b{background:rgba(79,163,209,.18);color:#9ed0ea}
  .chip.g{background:rgba(99,185,138,.18);color:#a5dcbe}
  .chip.warn{background:rgba(255,86,86,.18);color:#ff9b9b}

  .sechead{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f8996;font-weight:800;
    margin:20px 2px 2px;padding-top:12px;border-top:1px solid var(--line)}
  .sechead:first-child{border-top:0;margin-top:6px;padding-top:0}

  .note{font-size:11.5px;color:#93a8b2;line-height:1.6;background:rgba(255,255,255,.04);
    border-left:2px solid var(--orange);border-radius:0 8px 8px 0;padding:9px 11px;margin:10px 0}
  .note b{color:var(--cream)}

  /* ---------- MAP ---------- */
  #mapwrap{flex:1 1 auto;position:relative;height:100%}
  #map{position:absolute;inset:0;background:#0b1116}
  .leaflet-container{font-family:inherit;background:#0b1116}

  /* markers */
  .pin{position:relative;width:0;height:0}
  .pin .dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-weight:800;color:#fff;border:2.5px solid #fff;
    box-shadow:0 3px 12px rgba(0,0,0,.65);transition:transform .18s ease;cursor:pointer}
  .pin:hover .dot{transform:translate(-50%,-50%) scale(1.18)}
  .pin.hike .dot{width:32px;height:32px;font-size:14px;background:var(--orange)}
  .pin.base .dot{width:36px;height:36px;font-size:15px;background:#12222a;border-color:var(--orange);color:var(--orange)}
  .pin.poi  .dot{width:15px;height:15px;background:var(--cream);border-width:2px;border-color:#3a5866}
  .pin.air  .dot{width:28px;height:28px;font-size:13px;background:var(--blue)}
  .pin.up .lbl{top:auto !important;bottom:calc(50% + 20px)}
  .pin .lbl{position:absolute;left:50%;top:calc(50% + 20px);transform:translateX(-50%);
    background:rgba(12,22,28,.86);backdrop-filter:blur(4px);color:var(--cream);font-size:10.5px;font-weight:700;
    letter-spacing:.03em;padding:2.5px 7px;border-radius:5px;white-space:nowrap;border:1px solid rgba(244,239,231,.16);
    pointer-events:none;text-shadow:0 1px 2px #000}
  .pin.base .lbl{top:calc(50% + 23px);border-color:rgba(237,106,44,.6);color:#ffd9c5}
  .pin.poi .lbl{top:calc(50% + 10px);font-size:9.5px;font-weight:600;background:rgba(12,22,28,.7);color:#c6d5dc;padding:1.5px 5px}
  /* de-clutter: waypoints only appear once you're zoomed into a hike */
  .zfar .pin.poi{display:none}
  .zfar .pin .lbl{font-size:9.5px;padding:2px 6px}
  .pin .nightbadge{position:absolute;left:calc(50% + 11px);top:calc(50% - 22px);transform:translateX(-50%);
    background:var(--orange);color:#fff;font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 5px;border-radius:4px;
    border:1.5px solid #12222a;white-space:nowrap;pointer-events:none}

  /* popups */
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--cream);border-radius:14px;padding:0;
    box-shadow:0 18px 50px rgba(0,0,0,.7);border:1px solid rgba(244,239,231,.15);overflow:hidden}
  .leaflet-popup-content{margin:0;width:316px !important;line-height:1.5}
  .leaflet-popup-tip{background:var(--panel);border:1px solid rgba(244,239,231,.15)}
  .leaflet-popup-close-button{color:#fff !important;font-size:22px !important;width:30px !important;height:30px !important;
    padding:2px 0 0 0 !important;text-shadow:0 1px 3px #000;z-index:5}
  .leaflet-container a.leaflet-popup-close-button:hover{color:var(--orange) !important}

  .pop .img{height:132px;background:linear-gradient(135deg,#2b4552,#16262e);position:relative;overflow:hidden}
  .pop .img img{width:100%;height:100%;object-fit:cover;display:block}
  .pop .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,26,32,0) 40%,rgba(15,26,32,.92) 100%)}
  .pop .img .cap{position:absolute;left:14px;right:14px;bottom:9px;z-index:2}
  .pop .img .kicker{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);
    text-shadow:0 1px 4px #000;margin-bottom:2px}
  .pop .img h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .pop .body{padding:12px 14px 14px}
  .pop .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}
  .pop .st{background:rgba(255,255,255,.06);border-radius:7px;padding:6px 4px;text-align:center}
  .pop .st .v{font-size:13px;font-weight:800;color:var(--cream);line-height:1.1}
  .pop .st .k{font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#7f97a2;margin-top:3px}
  .pop p{margin:0 0 9px;font-size:12.5px;color:#c8d6dc}
  .pop .row{display:flex;gap:7px;font-size:11.5px;color:#b3c4cc;padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}
  .pop .row b{color:var(--cream);font-weight:700;flex:0 0 74px}
  .pop .flag{font-size:11.5px;background:rgba(237,106,44,.14);border-left:2px solid var(--orange);
    padding:7px 10px;border-radius:0 7px 7px 0;color:#f2c3aa;margin:9px 0 0}
  .pop a.btn{display:inline-block;margin-top:11px;background:var(--orange);color:#fff;text-decoration:none;
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:7px}
  .pop a.btn:hover{background:#ff7d3e}
  .pop a.btn.ghost{background:rgba(255,255,255,.08);color:#cfdde3;margin-left:6px}
  .pop a.btn.ghost:hover{background:rgba(255,255,255,.16)}

  /* legend / controls */
  .panelbox{background:rgba(15,26,32,.9);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;box-shadow:0 8px 30px rgba(0,0,0,.55);color:var(--cream)}
  .legend h4{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7f97a2;font-weight:800}
  .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:5px 0;color:#c8d6dc}
  .sw{width:22px;height:0;border-top-width:3px;border-top-style:solid;flex:0 0 22px;border-radius:2px}
  .swd{width:13px;height:13px;border-radius:50%;flex:0 0 13px;border:2px solid #fff}
  .toggle{display:flex;align-items:center;gap:8px;font-size:11.5px;cursor:pointer;margin:6px 0;color:#c8d6dc;user-select:none}
  .toggle input{accent-color:var(--orange);width:14px;height:14px;cursor:pointer}

  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:900;font-size:11.5px;color:#a9bdc6;
    pointer-events:none;transition:opacity .5s}
  .leaflet-control-attribution{background:rgba(15,26,32,.82) !important;color:#7f97a2 !important;font-size:9.5px !important}
  .leaflet-control-attribution a{color:#9db0ba !important}
  .leaflet-bar a{background:#1d2f38 !important;color:var(--cream) !important;border-color:rgba(244,239,231,.14) !important}
  .leaflet-bar a:hover{background:#2b4552 !important}
  .leaflet-control-layers{background:rgba(15,26,32,.92) !important;color:var(--cream) !important;
    border:1px solid var(--line) !important;border-radius:10px !important;backdrop-filter:blur(10px)}
  .leaflet-control-layers-expanded{padding:10px 12px !important;font-size:12px}
  .leaflet-control-layers-separator{border-color:var(--line) !important}

  #burger{display:none}

  @media (max-width:900px){
    :root{--sidebar:100%}
    #app{flex-direction:column}
    #side{position:absolute;inset:0;transform:translateY(0);transition:transform .3s ease;height:100%}
    #side.hidden{transform:translateY(calc(100% - 0px));pointer-events:none}
    #mapwrap{position:absolute;inset:0}
    #burger{display:flex;align-items:center;gap:7px;position:absolute;left:12px;top:12px;z-index:1300;
      background:var(--orange);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:800;
      letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer}
    .legend{display:none}
    .leaflet-popup-content{width:250px !important}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg class="topo" viewBox="0 0 420 130" preserveAspectRatio="none">
        <g fill="none" stroke="#ED6A2C" stroke-width="1">
          <path d="M-20 118 C 60 96, 110 128, 180 104 S 300 78, 440 100"/>
          <path d="M-20 104 C 60 82, 112 114, 182 90 S 300 62, 440 86"/>
          <path d="M-20 90 C 62 68, 114 100, 184 76 S 300 46, 440 72"/>

      <div class="tab on" data-filter="all">Everything</div>
      <div class="tab" data-filter="hike">Hikes</div>
      <div class="tab" data-filter="base">Nights</div>
      <div class="tab" data-filter="travel">Travel</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  sanvito:[46.4586,12.2069],

/* ---------- MAP SETUP ---------- */
const map = L.map('map',{zoomControl:false,minZoom:6,maxZoom:17,zoomSnap:.25,scrollWheelZoom:true});

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:17,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});
const labels = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {maxZoom:19,subdomains:'abcd',opacity:.85,attribution:'&copy; CARTO'});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {maxZoom:17,subdomains:'abc',attribution:'&copy; OpenTopoMap (CC-BY-SA) · &copy; OpenStreetMap contributors'});
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {maxZoom:19,subdomains:'abcd',attribution:'&copy; CARTO · &copy; OpenStreetMap contributors'});

const satGroup = L.layerGroup([sat,labels]);
satGroup.addTo(map);
L.control.layers({"Satellite":satGroup,"Topo / trails":topo,"Dark":dark},null,{position:'topright'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

const routeLayer = L.layerGroup().addTo(map);
const driveLayer = L.layerGroup().addTo(map);
const poiLayer   = L.layerGroup().addTo(map);
const pinLayer   = L.layerGroup().addTo(map);
const altLayer   = L.layerGroup();   // Piz Boè option, off by default

/* ---------- DRIVES ---------- */
DRIVES.forEach(d=>{
  L.polyline(d.pts,{color:'#4FA3D1',weight:2,opacity:.55,dashArray:'3,7'})
    .bindTooltip(d.name,{sticky:true,className:'drv'}).addTo(driveLayer);
});

/* ---------- POPUP BUILDER ---------- */
function popHTML(s){
  const img = s.pic
    ? `<div class="img"><img src="${s.pic}" alt="" onerror="this.style.display='none'">
         <div class="cap"><div class="kicker">${s.tag}</div><h3>${s.title}</h3></div></div>`
    : `<div class="img"><div class="cap"><div class="kicker">${s.tag}</div><h3>${s.title}</h3></div></div>`;
  const stats = s.stats ? `<div class="stats">${s.stats.map(x=>`<div class="st"><div class="v">${x[0]}</div><div class="k">${x[1]}</div></div>`).join('')}</div>`:'';
  const rows  = s.rows ? s.rows.map(r=>`<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('') : '';
  const flag  = s.flag ? `<div class="flag">${s.flag}</div>`:'';
  const gmaps = `https://www.google.com/maps/search/?api=1&query=${s.at[0]},${s.at[1]}`;
  const link  = s.link ? `<a class="btn" href="${s.link}" target="_blank" rel="noopener">Full guide ↗</a>`:'';
  return `<div class="pop">${img}<div class="body">${stats}<p>${s.blurb}</p>${rows}${flag}
    ${link}<a class="btn ghost" href="${gmaps}" target="_blank" rel="noopener">Maps ↗</a></div></div>`;
}

/* ---------- MARKERS ---------- */
const markers = {};
STOPS.forEach(s=>{
  const cls = s.kind==='base' ? 'base' : (s.kind==='travel' ? 'air' : 'hike');
  const badge = s.badge ? `<div class="nightbadge">${s.badge}</div>` : '';
  const icon = L.divIcon({className:'', iconSize:[0,0], html:
    `<div class="pin ${cls}${s.up?' up':''}" data-kind="${s.kind}"><div class="dot">${s.n}</div>${badge}<div class="lbl">${s.label}</div></div>`});
  const m = L.marker(s.at,{icon,riseOnHover:true,zIndexOffset: s.kind==='base'?1000:500})
    .bindPopup(popHTML(s),{maxWidth:340,minWidth:316,
      autoPanPaddingTopLeft:[30,66], autoPanPaddingBottomRight:[30,40]});
  m.on('popupopen',()=>{
    document.querySelectorAll('.daycard').forEach(c=>c.classList.toggle('active',c.dataset.id===s.id));
  });
  markers[s.id]=m;

  const target = s.off ? altLayer : pinLayer;
  m.addTo(target);

  // routes
  [s.route,s.route2].forEach(r=>{
    if(!r) return;
    const halo = L.polyline(r.pts,{color:'#0b1116',weight:8,opacity:.5});
    const line = L.polyline(r.pts,{color:r.color,weight:3.5,opacity:.95,dashArray:r.dash||null,lineJoin:'round'})
      .bindTooltip(r.name,{sticky:true});
    const g = L.layerGroup([halo,line]);
    g.addTo(s.off ? altLayer : routeLayer);
  });

  // small POIs
  (s.pois||[]).forEach(p=>{
    L.marker(p.at,{icon:L.divIcon({className:'',iconSize:[0,0],
      html:`<div class="pin poi"><div class="dot"></div><div class="lbl">${p.label}</div></div>`}),
      zIndexOffset:100}).addTo(s.off ? altLayer : poiLayer);
  });
});

/* ---------- FIT ---------- */
const CORE = L.latLngBounds(STOPS.filter(s=>s.kind!=='travel').map(s=>s.at).concat([C.pordoi,C.vigo]));
function fitAll(){
  map.invalidateSize({animate:false});
  const mob = window.innerWidth<=900;
  map.fitBounds(CORE,{paddingTopLeft:[mob?30:60, mob?100:50], paddingBottomRight:[mob?30:60, mob?70:50]});
}
map.setView([46.52,11.96],10);
fitAll();
setTimeout(fitAll,150);
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(fitAll,250);});

/* ---------- ZOOM-AWARE DECLUTTER ---------- */
function zclass(){
  const el = map.getContainer();
  el.classList.toggle('zfar', map.getZoom() < 11.8);
}
map.on('zoomend', zclass); zclass();

/* ---------- LEGEND + TOGGLES ---------- */
const legend = L.control({position:'bottomleft'});
legend.onAdd = function(){
  const d = L.DomUtil.create('div','panelbox legend');
  d.innerHTML = `
    <h4>Legend</h4>
    <div class="lg"><span class="swd" style="background:#ED6A2C"></span> Hike (numbered 1–5)</div>
    <div class="lg"><span class="swd" style="background:#12222a;border-color:#ED6A2C"></span> Basecamp / night</div>
    <div class="lg"><span class="swd" style="background:#4FA3D1"></span> Airport &amp; transfers</div>
    <div class="lg"><span class="sw" style="border-top-color:#ED6A2C"></span> Hiking route</div>
    <div class="lg"><span class="sw" style="border-top-color:#4FA3D1;border-top-style:dotted"></span> Driving leg</div>
    <h4 style="margin-top:11px">Layers</h4>
    <label class="toggle"><input type="checkbox" id="tAlt"> Show Piz Boè alternative</label>
    <label class="toggle"><input type="checkbox" id="tDrive" checked> Driving legs</label>
    <label class="toggle"><input type="checkbox" id="tPoi" checked> Waypoint labels</label>`;
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);

document.getElementById('tAlt').onchange = e => e.target.checked ? altLayer.addTo(map) : map.removeLayer(altLayer);
document.getElementById('tDrive').onchange = e => e.target.checked ? driveLayer.addTo(map) : map.removeLayer(driveLayer);
document.getElementById('tPoi').onchange  = e => e.target.checked ? poiLayer.addTo(map)   : map.removeLayer(poiLayer);

/* ---------- SIDEBAR LIST ---------- */
const listEl = document.getElementById('list');
const SECTIONS = [
  {after:null, label:"Phase 0 · Get there"},
  {after:"basecamp", label:"Phase 1 · The Cortina classics"},
  {after:"h3", label:"Phase 2 · Into the clouds"},
  {after:"n4", label:"Phase 3 · The grand finale"}
];

function renderList(filter){
  listEl.innerHTML='';
  let first=true;
  STOPS.forEach(s=>{
    const sec = SECTIONS.find(x=>x.after===(first?null:null));
    if(false){}
    if(filter!=='all' && s.kind!==filter) return;
    const card=document.createElement('div');
    card.className='daycard';
    card.style.setProperty('--stripe',s.stripe);
    card.dataset.id=s.id;
    const chips = (s.stats||[]).slice(0,3).map((x,i)=>`<span class="chip ${i===0?'o':''}">${x[0]} ${x[1].toLowerCase()}</span>`).join('');
    card.innerHTML=`
      <div class="dhead"><span class="dnum">${s.tag}</span><span class="ddate">${s.day}</span></div>
      <div class="dtitle">${s.title}</div>
      <div class="dmeta">${s.meta}</div>
      <div class="chips">${chips}</div>`;
    card.onclick=()=>select(s.id);
    listEl.appendChild(card);
    first=false;
  });
  if(filter==='all'){
    const n=document.createElement('div');
    n.className='note';
    n.innerHTML=`<b>The one fixed point:</b> the Tre Cime parking pass is booked for <b>Thursday 20 Aug</b> — everything else flexes around it. Hikes 1 and 2 are interchangeable between Tuesday afternoon and Wednesday; Nuvolau is short enough for arrival day, Lagazuoi/Piz Boè needs a full one.`;
    listEl.appendChild(n);
    const n2=document.createElement('div');
    n2.className='note';
    n2.innerHTML=`<b>Routes are indicative</b> — drawn through the real waypoints for orientation, not surveyed GPX. Download the tracks from the linked guides before you go, and carry them offline.`;
    listEl.appendChild(n2);
  }
}

function select(id){
  const s = STOPS.find(x=>x.id===id);
  if(!s) return;
  if(s.off && !map.hasLayer(altLayer)){
    altLayer.addTo(map);
    document.getElementById('tAlt').checked=true;
  }
  document.querySelectorAll('.daycard').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  map.flyTo(s.focus||s.at, s.zoom|| (s.kind==='travel'?9:13.5), {duration:.9});
  map.once('moveend',()=>setTimeout(()=>markers[id].openPopup(),60));
  if(window.innerWidth<=900) document.getElementById('side').classList.add('hidden');
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    renderList(t.dataset.filter);
  };
});
renderList('all');

/* mobile */
document.getElementById('burger').onclick=()=>document.getElementById('side').classList.toggle('hidden');
if(window.innerWidth<=900) document.getElementById('side').classList.add('hidden');

/* hint fade */
setTimeout(()=>{const h=document.getElementById('hint'); if(h) h.style.opacity=0;},5000);
</script>
